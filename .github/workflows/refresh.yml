name: Weekly Catapult accelerator refresh

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC
  workflow_dispatch:

concurrency:
  group: catapult-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # commit data.json
      id-token: write   # required by claude-code-action's GitHub app authentication
      pages: write      # request a Pages rebuild after the commit
    steps:
      - uses: actions/checkout@v4

      - name: Today's date
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Research and rewrite data.json
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Today's date is ${{ steps.today.outputs.date }}.
            Read the file .github/refresh-prompt.md and follow its instructions exactly.
            Edit only data.json. Do not commit, push or open a pull request; the workflow does that.
          claude_args: |
            --allowedTools "WebFetch,WebSearch,Read,Edit,Write,Glob,Grep"

      - name: Validate data.json
        run: python3 .github/validate.py data.json

      - name: Commit changes
        run: |
          git config user.name "catapult-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to data.json"
          else
            git commit -m "Weekly refresh ${{ steps.today.outputs.date }}"
            git push
          fi

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the push may still trigger a build."
